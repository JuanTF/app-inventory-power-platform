    Properties:
      Fill: =ColorValue("#EDF2E7")
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - ContFondoNuevo:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =Color.White
            Height: =Parent.Height - 190
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: |+
              =Parent.Width - 60
            X: =30
            Y: =165
