                  DisplayName: =DataSourceInfo([@TblProductos],DataSourceInfo.DisplayName,Producto)
                  Height: =115
                  MaxLength: =DataSourceInfo([@TblProductos], DataSourceInfo.MaxLength, Producto)
                  Required: =false
                  Update: =DataCardValue3.Text
                  Width: =Parent.Width
                  X: =0
                  Y: =0
