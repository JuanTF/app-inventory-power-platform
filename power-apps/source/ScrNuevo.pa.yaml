            Width: =Parent.Width
      - LblTitulo:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =25
            Text: |-
              =If(
                  FrmProductos.Mode = FormMode.New,
                  "NUEVO PRODUCTO",
                  "EDITAR PRODUCTO"
              )
            Width: =298
            X: =171
            Y: =35
      - FrmProductos:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            DataSource: =TblProductos
            Fill: =Color.Transparent
            Height: =820
            Item: =VarProducto
            OnSuccess: |-
              =Notify(
                  "Producto guardado correctamente",
                  NotificationType.Success
              );
              Navigate(
                  ScrPrincipal,
                  ScreenTransition.None
              )
            Width: =Parent.Width - 90
            X: =45
            Y: =180
          Children:
            - Producto_DataCard1:
                Control: TypedDataCard@1.0.7
                Variant: ClassicTextualEdit
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  DataField: ="Producto"
