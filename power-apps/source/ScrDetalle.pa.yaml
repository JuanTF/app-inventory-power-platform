      - RectFondoEliminar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 0.40)
            Height: =Parent.Height
            Visible: =locMostrarEliminar
            Width: =Parent.Width
      - ContConfirmarEliminar:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =Color.White
            Height: =335
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Visible: =locMostrarEliminar
            Width: =Parent.Width - 80
            X: =(Parent.Width - Self.Width) / 2
            Y: =(Parent.Height - Self.Height) / 2
          Children:
            - TextPregunta:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =ColorValue("#303030")
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =40
                  Size: =23
                  Text: ="¿Eliminar producto?"
                  Width: =Parent.Width - 50
                  X: =25
                  Y: =25
            - TextCuerpo:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =ColorValue("#555555")
                  Font: =Font.'Open Sans'
                  Height: =145
                  Size: =18
                  Text: |-
                    ="¿Deseas eliminar el producto «" &
                    locProductoEliminar.Producto &
                    "»?" &
                    Char(10) & Char(10) &
                    "Se eliminará del inventario. Esta acción no se puede deshacer desde la aplicación."
                  VerticalAlign: =VerticalAlign.Top
                  Width: =Parent.Width - 50
                  X: =25
                  Y: =80
            - BtnCancelarEliminar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =ColorValue("#333333")
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |-
                    =If(
                        locEliminando,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =ColorValue("#EAEAEA")
                  Font: =Font.'Open Sans'
                  Height: =55
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorValue("#DDDDDD")
                  OnSelect: |-
                    =UpdateContext({locMostrarEliminar: false})
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =Self.Color
                  Size: =18
                  Text: ="Cancelar"
                  Width: =(Parent.Width - 65) / 2
                  X: =25
                  Y: =250
            - BtnConfirmarEliminar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  BorderThickness: =0
                  Color: =Color.White
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  DisplayMode: |-
                    =If(
                        locEliminando,
                        DisplayMode.Disabled,
                        DisplayMode.Edit
                    )
                  Fill: =ColorValue("#B54A4A")
                  Font: =Font.'Open Sans'
                  Height: =55
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =ColorValue("#983D3D")
                  OnSelect: |-
                    =UpdateContext({locEliminando: true});

                    If(
                        IfError(
                            Remove(
                                TblProductos,
                                locProductoEliminar
                            );
                            true,
                            false
                        ),

                        UpdateContext(
                            {
                                locMostrarEliminar: false,
                                locEliminando: false
                            }
                        );
                        Notify(
                            "Producto eliminado correctamente.",
                            NotificationType.Success
                        );
                        Navigate(
                            ScrPrincipal,
                            ScreenTransition.None
                        ),

                        UpdateContext({locEliminando: false});
                        Notify(
                            "No se pudo eliminar el producto. Inténtalo nuevamente.",
                            NotificationType.Error
                        )
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =Self.Fill
                  PressedFill: =ColorValue("#803333")
                  Size: =18
                  Text: |-
                    =If(
                        locEliminando,
                        "Eliminando...",
                        "Sí, eliminar"
                    )
                  Width: =BtnCancelarEliminar.Width
                  X: =BtnCancelarEliminar.X + BtnCancelarEliminar.Width + 15
                  Y: =250
