Screens:
  ScrInicio:
    Properties:
      Fill: =RGBA(175, 191, 224, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(0, 0, 0, 1)
            Height: =141
            Width: =640
      - Label1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =25
            Text: ="GESTIÓN DE INVENTARIOS"
            Width: =640
            Y: =34
      - CntRegistro:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            Height: =723
            RadiusBottomLeft: =24
            RadiusBottomRight: =24
            RadiusTopLeft: =24
            RadiusTopRight: =24
            Width: =568
            X: =33
            Y: =231
          Children:
            - Label2:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Text: ="USUARIO:"
                  Width: =500
                  X: =38
                  Y: =57
            - Label2_1:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Text: ="CONTRASEÑA:"
                  Width: =500
                  X: =38
                  Y: =252
            - TxtUsuario:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Default: =
                  Font: =Font.'Open Sans'
                  HintText: ="Ingrese su usuario"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Width: =500
                  X: =38
                  Y: =135
            - TxtContrasenia:
                Control: Classic/TextInput@2.3.2
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Default: =
                  Font: =Font.'Open Sans'
                  HintText: ="Ingrese su contraseña"
                  HoverBorderColor: =RGBA(0, 18, 107, 1)
                  HoverFill: =RGBA(186, 202, 226, 1)
                  Mode: =TextMode.Password
                  Width: =500
                  X: =38
                  Y: =327
            - BtnIngresar:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =ColorFade(Self.Fill, -15%)
                  Color: =RGBA(255, 255, 255, 1)
                  DisabledBorderColor: =RGBA(166, 166, 166, 1)
                  Fill: =RGBA(0, 0, 0, 1)
                  Font: =Font.'Open Sans'
                  Height: =68
                  HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(166, 166, 166, 1)
                  OnSelect: |-
                    =If(
                        IsBlank(Trim(TxtUsuario.Text)) Or IsBlank(TxtContrasenia.Text),
                        Notify(
                            "Ingrese su usuario y contraseña.",
                            NotificationType.Warning
                        ),
                        Refresh(UserInventory);
                        With(
                            {
                                usuarioEncontrado: LookUp(
                                    UserInventory,
                                    Usuario = Trim(TxtUsuario.Text)
                                )
                            },
                            If(
                                IsBlank(usuarioEncontrado.ID),
                                Notify(
                                    "El usuario o la contraseña son incorrectos.",
                                    NotificationType.Error
                                ),
                                usuarioEncontrado.Contrasenia <> TxtContrasenia.Text,
                                Notify(
                                    "El usuario o la contraseña son incorrectos.",
                                    NotificationType.Error
                                ),
                                Switch(
                                    usuarioEncontrado.Estado.Value,
                                    "Activo",
                                        Navigate(
                                            ScrPrincipal,
                                            ScreenTransition.Cover
                                        );
                                        Reset(TxtUsuario);
                                        Reset(TxtContrasenia),
                                    "Pendiente",
                                        Notify(
                                            "Su registro está pendiente de aprobación.",
                                            NotificationType.Warning
                                        ),
                                    "Rechazado",
                                        Notify(
                                            "Su solicitud fue rechazada. Contacte al responsable.",
                                            NotificationType.Error
                                        ),
                                    Notify(
                                        "Su usuario no tiene acceso habilitado.",
                                        NotificationType.Warning
                                    )
                                )
                            )
                        )
                    )
                  PressedBorderColor: =Self.Fill
                  PressedColor: =
                  PressedFill: =RGBA(255, 255, 255, 1)
                  Text: ="INGRESAR"
                  Width: =500
                  X: =38
                  Y: =463
      - Label6:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(101, 109, 120, 1)
            Font: =Font.'Open Sans'
            Height: =80
            Size: =19
            Text: ="¿Todavía no tienes una cuenta?"
            Width: =388
            X: =123
            Y: =791
      - BtnRegistrar:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(129, 154, 204, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisabledColor: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Height: =60
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(129, 154, 204, 1)
            OnSelect: =Navigate(ScrRegistro)
            PressedBorderColor: =Self.Fill
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(129, 154, 204, 1)
            Size: =22
            Text: ="Registrarme"
            Width: =488
            X: =76
            Y: =862
