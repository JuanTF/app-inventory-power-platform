      - Label1_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Bold
            Size: =25
            Text: ="PRINCIPAL"
            Width: =640
            Y: =34
      - Icon1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Icon: =Icon.Add
            OnSelect: |-
              =NewForm(FrmProductos)
              ;
              Navigate(ScrNuevo,ScreenTransition.Cover)
            X: =534
            Y: =38
      - Icon9:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Icon: =Icon.Reload
            OnSelect: =Refresh(TblProductos)
            X: =40
            Y: =40
      - BtnVolverInicio:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            BorderStyle: =BorderStyle.None
            Color: =RGBA(80, 80, 80, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =ColorValue("#F3F4F5")
            Font: =Font.'Open Sans'
            Height: =47
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(210, 210, 210, 1)
            OnSelect: |-
              =Reset(TxtUsuario);
              Reset(TxtContrasenia);
              Navigate(
                  ScrInicio,
                  ScreenTransition.Fade
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =RGBA(80, 80, 80, 1)
            Size: =22
            Text: ="Volver al acceso"
            Width: =558
            X: =40
            Y: =1055
      - BtnActualizarBI:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#BDBDBD")
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |-
              =If(
                  varSolicitandoActualizacion,
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =ColorValue("#326B9F")
            Font: =Font.'Open Sans'
            Height: =65
            HoverBorderColor: =ColorValue("#747474")
            HoverColor: =ColorValue("#333333")
            HoverFill: =ColorFade(Self.Fill, -10%)
            OnSelect: |-
              =Set(varSolicitandoActualizacion, true);
              IfError(
                  Set(
                      varRespuestaActualizacion,
                      Inventory_ActualizarReporteInventario.Run()
                  ),
                  Notify(
                      "No se pudo solicitar la actualización. Revisa el historial del flujo.",
                      NotificationType.Error
                  ),
                  Notify(
                      varRespuestaActualizacion.mensaje,
                      NotificationType.Information
                  )
              );
              Set(varSolicitandoActualizacion, false)
            PressedBorderColor: =ColorValue("#747474")
            PressedColor: =Color.White
            PressedFill: =ColorFade(Self.Fill, -20%)
            Size: =18
            Text: |-
              =If(
                  varSolicitandoActualizacion,
                  "Enviando solicitud...",
                  "Actualizar BI"
              )
            X: =30
            Y: =160
      - BtnActualizarBI_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorValue("#BDBDBD")
            BorderThickness: =0
            Color: =Color.White
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =ColorValue("#287D78")
            Font: =Font.'Open Sans'
            Height: =65
            HoverBorderColor: =ColorValue("#747474")
            HoverColor: =ColorValue("#333333")
            HoverFill: =ColorFade(Self.Fill, -10%)
            OnSelect: =Launch("https://teams.microsoft.com/l/app/?titleId=T_721a1efa-d58c-5d41-6a87-2db7371d09cd")
            PressedBorderColor: =ColorValue("#747474")
            PressedColor: =Color.White
            PressedFill: =ColorFade(Self.Fill, -20%)
            Size: =18
            Text: ="Asistente IA"
            X: =330
            Y: =160
