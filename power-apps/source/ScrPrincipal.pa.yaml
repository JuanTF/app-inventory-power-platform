                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        ThisItem.IsSelected,
                        ColorValue("#111111"),
                        ColorValue("#555555")
                    )
                  Height: =33
                  Icon: =Icon.ChevronRight
                  OnSelect: |-
                    =//Creando una variable global SET(NOMVAR, VALOR)
                    Set(VarProducto, ThisItem)
                    ;
                    Navigate(ScrDetalle,ScreenTransition.UnCoverRight)
