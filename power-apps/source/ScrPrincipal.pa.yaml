                  X: =497
                  Y: =50
            - LblEstadoStock:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Center
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =ColorValue("#A4262C")
                  Fill: =ColorValue("#FCE4E4")
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =32
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingTop: =0
                  Size: =15
                  Text: |-
                    =If(
                        Value(ThisItem.StockActual) = 0,
                        "Agotado",
                        "Bajo stock"
                    )
                  Visible: =Value(ThisItem.StockActual) <= Value(ThisItem.StockMinimo)
                  Width: =145
                  X: =IcoDetalleProducto.X - Self.Width - 12
                  Y: =IcoDetalleProducto.Y + (IcoDetalleProducto.Height - Self.Height) / 2
            - Label3_2:
                Control: Label@2.5.1
