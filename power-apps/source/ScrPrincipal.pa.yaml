                    =If(
                        ThisItem.IsSelected,
                        ColorValue("#111111"),
                        ColorValue("#555555")
                    )
                  Font: =Font.'Open Sans'
                  Height: =26
                  OnSelect: =Select(Parent)
                  Size: =16
                  Text: =ThisItem.Categoria
                  Width: =196
                  X: =34
                  Y: =50
            - IcoDetalleProducto:
                Control: Classic/Icon@2.5.0
