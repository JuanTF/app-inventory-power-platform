                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =ColorValue("#747474")
                  Height: =Parent.TemplateHeight
                  OnSelect: =Select(Parent)
                  Visible: =ThisItem.IsSelected
                  Width: =6
            - Label4:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Bold
                  Height: =41
                  OnSelect: =Select(Parent)
                  Size: =24
